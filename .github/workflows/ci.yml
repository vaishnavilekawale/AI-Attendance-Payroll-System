name: Flask App Auto Run & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create Required Directories
        run: |
          mkdir -p instance dataset uploads trained_model payrolls

      - name: Check Database & App Launch
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DATABASE_URL: "sqlite:////home/runner/work/AI-Attendance-Payroll-System/AI-Attendance-Payroll-System/instance/attendance.db"
        run: |
          python -c "from app import app, db; app.app_context().push(); db.create_all(); print('App and Database loaded successfully!')"